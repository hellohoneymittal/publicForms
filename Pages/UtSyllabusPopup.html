<!doctype html>
<div class="popup" id="viewSyllabusPopup">
  <div class="popup-content scrollable-content">
    <img
      src="https://drive.google.com/thumbnail?id=15-SQ9oW0U2eX2vsWmyxvmhwu9Q1QgOZm&sz=w500"
      alt="School Logo"
    />
    <h2 id="syllabusTitle">Exam Syllabus</h2>

    <div id="selectionForm">
      <select
        id="classSelect"
        style="margin-bottom: 10px"
        onchange="onClassChange()"
      >
        <option value="">Select Class</option>
      </select>

      <!-- Subject Selection -->
      <select
        id="subjectSelect"
        style="margin-bottom: 10px"
        onchange="onSubjectChange()"
      >
        <option value="">Select Subject</option>
      </select>

      <!-- UT Selection -->
      <select id="utSelect" style="margin-bottom: 10px">
        <option value="">Select Exam</option>
      </select>

      <!-- Buttons Row -->
      <div class="button-row">
        <button class="blue" onclick="backToMainPopup()">Back</button>
        <button class="red" onclick="resetSyllabusForm()">Reset</button>

        <button class="green" onclick="submitSyllabus()">Submit</button>
      </div>
    </div>
    <!-- end of selectionForm -->

    <div id="chapterContainer" style="display: none"></div>
  </div>
</div>

<div id="viewSyllabusContainer" class="popup">
  <div class="popup-content scrollable-content">
    <img
      src="https://drive.google.com/thumbnail?id=15-SQ9oW0U2eX2vsWmyxvmhwu9Q1QgOZm&sz=w500"
      alt="School Logo"
    />
    <div id="viewSyllabusBody"></div>
    <div class="button-row">
      <button class="blue" onclick="backToEditViewSyllabus()">Back</button>
      <button class="green" onclick="downloadSyllabus()">Download PDF</button>
    </div>
  </div>
</div>

<div id="editSyllabusContainer" class="popup">
  <div class="popup-content scrollable-content">
    <img
      src="https://drive.google.com/thumbnail?id=15-SQ9oW0U2eX2vsWmyxvmhwu9Q1QgOZm&sz=w500"
      alt="School Logo"
    />
    <h3>Syllabus Unit Mapping</h3>
    <h4>
      Class: <span id="editClass"></span> | Subject:
      <span id="editSubject"></span>
    </h4>

    <div id="bulk-section">
      <div class="custom-control-row">
        <div class="textAlignLeft" style="flex: 1 1 25%; padding-right: 10px">
          Bulk Assign:
        </div>
        <div style="flex: 1 1 40%; padding-right: 10px">
          <select id="masterSelect">
            <option value="">Select Test</option>
            <option>Unit Test 1</option>
            <option>Unit Test 2</option>
            <option>Unit Test 3</option>
            <option>Unit Test 4</option>
            <option>Unit Test 5</option>
            <option>Unit Test 6</option>
          </select>
        </div>
        <div style="flex: 1 1 20%; padding-right: 10px">
          <button class="marginTop1 purple" onclick="applyBulk()">Apply</button>
        </div>
      </div>
      <div class="custom-control-row" style="display: none">
        <div class="textAlignLeft" style="flex: 1 1 25%; padding-right: 10px">
          Reset:
        </div>
        <div style="flex: 1 1 40%; padding-right: 10px">
          <select id="resetSelect">
            <option value="">Select UT</option>
            <option>Unit Test 1</option>
            <option>Unit Test 2</option>
            <option>Unit Test 3</option>
            <option>Unit Test 4</option>
            <option>Unit Test 5</option>
            <option>Unit Test 6</option>
          </select>
        </div>
        <div style="flex: 1 1 20%; padding-right: 10px">
          <button class="purple marginTop1" onclick="resetUT()">Reset</button>
        </div>
      </div>
    </div>

    <div id="chapterList" class="chapterList"></div>
    <div class="mapping-box">
      <h4>Live Mapping</h4>
      <div id="output"></div>
    </div>
    <div class="button-row">
      <button class="blue" onclick="backToEditViewSyllabus()">Back</button>
      <button class="green" onclick="SAVE_SYLLABUS_MAPPING()">Submit</button>
    </div>
  </div>
</div>
